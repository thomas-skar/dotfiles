# font
font_family Iosevka Custom
font_size 12.0

# behaviour
copy_on_select yes

# appearance
collapse_window_margins yes
draw_minimal_borders yes
draw_window_borders_for_single_window no
hide_window_decorations no
padding_fill_strategy background
placement_strategy center
single_window_margin_width 0
single_window_padding_width -1
window_border_width 0.5pt
window_margin_width 1
window_padding_width 12

# settings
shell_integration no-rc
linux_display_server wayland

# theme
background #2D2A2E
foreground #fcfcfa
cursor #fcfcfa
cursor_text_color #000000
selection_foreground #403e41
selection_background #fcfcfa
color0 #403e41
color1 #ff6188
color2 #a9dc76
color3 #ffd866
color4 #fc9867
color5 #ab9df2
color6 #78dce8
color7 #fcfcfa
color8 #727072
color9 #ff6188
color10 #a9dc76
color11 #ffd866
color12 #fc9867
color13 #ab9df2
color14 #78dce8
color15 #fcfcfa
