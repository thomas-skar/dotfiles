[audio]
enable_overdrive = false
enable_sounds = true

[bar.default]
start = ["active_window"]
center = ["date"]
end = [
  "tray",
  "spacer_end",
  "sysmon",
  "notifications",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "session",
]
margin_ends = 0
widget_spacing = 14

[battery]
warning_threshold = 20

[control_center]
sidebar = "full"
sidebar_section = "none"

[control_center.calendar]
show_events_card = false
show_week_numbers = true

[desktop_widgets]
enabled = false

[dock]
enabled = false
background_opacity = 0.66
icon_shadow = true
icon_size = 32
magnification = true
reserve_space = false
show_dots = true

[dock.monitor.eDP-1]
enabled = true

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 180.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 600.0

[location]
address = "Oslo, Norway"

[lockscreen]
enabled = true
fingerprint = true
lock_before_suspend = true
allow_empty_password = true
monitors = ["eDP-1"]
transition = []

[lockscreen_widgets]
enabled = false

[notification]
border = false
monitors = ["eDP-1", "DVI-I-1"]
show_actions = false

[osd]
monitors = ["eDP-1"]

[plugins]
enabled = []

[[plugins.source]]
name = "official"
enabled = false

[[plugins.source]]
name = "community"
enabled = false

[shell]
font_family = "SF Pro"
launch_apps_as_systemd_services = false
polkit_agent = true
screen_time_enabled = true
settings_expand_all_groups = true
settings_show_advanced = true

[shell.launcher]
categories = false
compact = true
fetch_exchange_rates = false
layout = "simple"
show_icons = true
sort_by_usage = false

[shell.launcher.providers.calculator]
global = false

[shell.panel]
open_near_click_control_center = true
open_near_click_launcher = true
open_near_click_session = true

[shell.session]
grid_columns = 1

[shell.window_switcher]
style = "compact"

[theme]
mode = "dark"
shell_mode = "dark"
source = "custom"
custom_palette = "custom"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "qt"]
community_ids = []
enable_builtin_templates = true
enable_community_templates = false

[wallpaper]
directory = "/usr/share/backgrounds"

[wallpaper.default]
path = "/usr/share/backgrounds/ubuntu-wallpaper-d.png"

[weather]
enabled = false

[widget.active_window]
interactive = false

[widget.date]
anchor = true
format = "{:%a %d %b - %H:%M}"

[widget.network]
show_label = false
vpn_status = "both"

[widget.spacer_end]
length = 33
type = "spacer"

[widget.sysmon]
show_value = false
visualization = "none"
